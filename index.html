<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Quick access to Flow AI."
    >
    <meta name="theme-color" content="#0b0b12">
    <title>AI Video Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body>
    <nav class="top-bar" aria-label="Main navigation">
      <span class="nav-brand"><span aria-hidden="true">✳</span> AI Video Master</span>
      <button class="refresh-button" type="button" aria-label="Refresh page" title="Refresh page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 7v5h-5M4.9 9a7.5 7.5 0 0 1 12.7-2L20 12M4 17v-5h5m10.1 3a7.5 7.5 0 0 1-12.7 2L4 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>

    <main class="directory" id="hub">
      <header class="page-heading">
        <p class="eyebrow">YOUR CREATIVE TOOLKIT</p>
        <h1>AI Video Master</h1>
        <p class="subtitle">Choose a tool to start creating.</p>
      </header>

      <section class="tool-list" aria-label="AI video tools">
        <article class="tool tool-flow">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 8v32M8 24h32M12.7 12.7l22.6 22.6m0-22.6L12.7 35.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="24" cy="24" r="5" fill="currentColor" fill-opacity=".32" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="tool-info">
            <h2>Flow AI</h2>
            <a class="open-tool" href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener noreferrer">
              Open Flow <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>

      </section>
    </main>

    <script>
      document.querySelector(".refresh-button").addEventListener("click", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
