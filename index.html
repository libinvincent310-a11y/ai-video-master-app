<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Quick access to Flow AI, Luma Dream Machine, Kling AI, PixVerse, and Pika."
    >
    <meta name="theme-color" content="#0b0b12">
    <title>AI Video Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body>
    <nav class="top-bar" aria-label="Main navigation">
      <span class="nav-brand"><span aria-hidden="true">✳</span> AI Video Master</span>
      <button class="refresh-button" type="button" aria-label="Refresh page" title="Refresh page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 7v5h-5M4.9 9a7.5 7.5 0 0 1 12.7-2L20 12M4 17v-5h5m10.1 3a7.5 7.5 0 0 1-12.7 2L4 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>

    <main class="directory" id="hub">
      <header class="page-heading">
        <p class="eyebrow">YOUR CREATIVE TOOLKIT</p>
        <h1>AI Video Master</h1>
        <p class="subtitle">Choose a tool to start creating.</p>
      </header>

      <section class="tool-list" aria-label="AI video tools">
        <article class="tool tool-flow">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 8v32M8 24h32M12.7 12.7l22.6 22.6m0-22.6L12.7 35.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="24" cy="24" r="5" fill="currentColor" fill-opacity=".32" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="tool-info">
            <h2>Flow AI</h2>
            <a class="open-tool" href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener noreferrer">
              Open Flow <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>

        <article class="tool tool-luma">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="11" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="24" cy="24" r="5" fill="currentColor" fill-opacity=".35"/>
              <path d="M24 5v6m0 26v6M5 24h6m26 0h6M10.6 10.6l4.2 4.2m18.4 18.4 4.2 4.2m0-26.8-4.2 4.2m-18.4 18.4-4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="tool-info">
            <h2>Luma Dream Machine</h2>
            <a class="open-tool" href="https://lumalabs.ai/dream-machine" target="_blank" rel="noopener noreferrer">
              Open Luma <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>

        <article class="tool tool-kling">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M17 11.5a2 2 0 0 1 3-1.73l17 9.81a2.8 2.8 0 0 1 0 4.84l-17 9.81a2 2 0 0 1-3-1.73v-21Z" fill="currentColor" fill-opacity=".27" stroke="currentColor" stroke-width="1.7"/>
              <path d="M10 17v14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="tool-info">
            <h2>Kling AI</h2>
            <a class="open-tool" href="https://klingai.com" target="_blank" rel="noopener noreferrer">
              Open Kling <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>

        <article class="tool tool-pixverse">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="m24 7 3.8 11.2L39 22l-11.2 3.8L24 37l-3.8-11.2L9 22l11.2-3.8L24 7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="m36 29 1.8 5.2L43 36l-5.2 1.8L36 43l-1.8-5.2L29 36l5.2-1.8L36 29Z" fill="currentColor" fill-opacity=".4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="tool-info">
            <h2>PixVerse</h2>
            <a class="open-tool" href="https://pixverse.ai" target="_blank" rel="noopener noreferrer">
              Open PixVerse <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>

        <article class="tool tool-pika">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 8.5 28.1 20l11.4 4-11.4 4L24 39.5 20 28l-11.5-4L20 20l4-11.5Z" fill="currentColor" fill-opacity=".23" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <circle cx="24" cy="24" r="3.4" fill="currentColor"/>
            </svg>
          </div>
          <div class="tool-info">
            <h2>Pika</h2>
            <a class="open-tool" href="https://pika.art" target="_blank" rel="noopener noreferrer">
              Open Pika <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>
      </section>
    </main>

    <script>
      document.querySelector(".refresh-button").addEventListener("click", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
